version: '3.8'

services:
  citizen-portal:
    build:
      context: ./citizen-portal
      dockerfile: Dockerfile
    container_name: citizen-portal
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  incidentlens-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentlens-copilot
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      - citizen-portal
    restart: unless-stopped
